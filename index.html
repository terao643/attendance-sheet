<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <title>父出欠確認アプリ</title>
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
  <script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
  
  <style>
    /* ===================================================
       Level 2: UIスタイル定義（CSS）
       ===================================================
       ・画面レイアウト
       ・テーマカラー
       ・テーブル/UIコンポーネント
       ・モーダル/スクロール制御
       =================================================== */
    
    /* HTML コードv9.6 リリース版 */
    /* ===================================================
       1. 全体設定・ルート変数
    =================================================== */
    /* アプリ全体で使い回すテーマカラーや基準サイズを定義します */
    :root {
      --main-green: #27ae60;    /* メインカラー（決定、参加など） */
      --sat-blue: #2980b9;      /* 土曜日の背景色 */
      --sun-red: #d35400;       /* 日・祝日の背景色 */
      --bg-light: #f4f7f8;      /* アプリ全体の背景色（薄いグレー） */
      --my-row-bg: #fffbe6;     /* ログインしている本人の行の背景色（薄い黄色） */
      --name-col-width: 60px;   /* 左端の名前列の固定幅 */
    }
    
    /* ベースレイアウト: 画面を固定し、意図しないブラウザスクロール（引っ張り）を抑制します */
    html, body {
      position: fixed; 
      width: 100%; 
      height: 100%;
      overflow: hidden; 
      overscroll-behavior: none; /* 下に引っ張ってリロードされるのを防ぐ */
      font-family: sans-serif; 
      margin: 0; 
      background: var(--bg-light); 
      color: #333;
    }

    /* メインのコンテナ: 画面の高さ（100dvh）にぴったり合わせ、内部でレイアウトを組みます */
    .container {
      padding: 4px; 
      display: flex; 
      flex-direction: column;
      height: 100%; 
      height: 100dvh; 
      overflow: hidden; 
      box-sizing: border-box;
    }

    /* タイトル文字 */
    h3 { 
      text-align: center; 
      font-size: 18px; 
      margin: 6px 0; 
      width: 100%; 
    }

    /* todayStr 表示用ラベル
       inline style 排除による保守性向上 */
    .today-label {
      font-size: 14px;
      color: #555;
      margin-left: 8px;
    }
    
    /* ===================================================
       2. 過去データ閲覧モード用 UI
    =================================================== */
    /* 年月日を選択するコントロールバー */
    .past-controls {
      display: none; /* 初期は非表示、閲覧モード時のみ flex に変更 */
      align-items: center; 
      justify-content: center; 
      padding: 6px; 
      background: white; 
      border-radius: 8px; 
      margin-bottom: 8px; 
      box-shadow: 0 1px 4px rgba(0,0,0,0.1);
    }
    .past-controls select { 
      padding: 2px 4px; 
      font-size: 15px; 
      border: 1px solid #ccc; 
      border-radius: 4px; 
      height: 36px; 
      box-sizing: border-box;
    }
    .past-controls span { 
      font-size: 14px; 
      font-weight: bold; 
      margin: 0 3px; 
      color: #555; 
    }
    
    /* 過去データ「表示」ボタン */
    .btn-show-past {
      padding: 0 16px; 
      margin-left: 5px; 
      background: var(--main-green); 
      color: white; 
      border: none; 
      border-radius: 4px; 
      font-weight: bold; 
      cursor: pointer;
      font-size: 18px; 
      height: 36px; 
      line-height: 1; 
      display: flex; 
      align-items: center; 
      justify-content: center;
      transition: all 0.3s ease; /* なめらかな変化アニメーション */
    }

    /* 日付変更後にボタンを強調（ハイライト）するためのクラス */
    .btn-highlight {
      background: #2ecc71 !important;  /* 少し明るい緑に */
      transform: translateY(-3px);     /* 上に少し浮かす */
      box-shadow: 0 24px 36px rgba(0,0,0,0.2);  /* 影を強くして浮遊感を出す */
      animation: pulse-green 1.5s infinite;     /* 軽く点滅させて注意を引く */
    }
    @keyframes pulse-green {
      0% { box-shadow: 0 0 0 0 rgba(46, 204, 113, 0.7); }
      70% { box-shadow: 0 0 0 10px rgba(46, 204, 113, 0); }
      100% { box-shadow: 0 0 0 0 rgba(46, 204, 113, 0); }
    }

    /* ===================================================
       3. 表（テーブル）のレイアウトとスクロール設定
    =================================================== */
    /* テーブルを囲む枠: 縦横のスクロールを担います */
    .table-wrapper {
      flex: 1; 
      overflow-y: auto; 
      overflow-x: auto;
      border-radius: 8px; 
      background: white; 
      box-shadow: 0 2px 8px rgba(0,0,0,0.1);
      margin-bottom: 65px; /* 下部保存ボタンの領域を確保 */
      position: relative;
    }
    table { 
      width: 100%; 
      border-collapse: collapse; 
      table-layout: fixed; 
      min-width: 100%; 
    }

    /* ヘッダー固定（縦スクロールしても上に残る） */
    thead { position: sticky; top: 0; z-index: 10; }
    th { background: var(--main-green); color: white; padding: 4px 0; font-size: 11px; border: none; font-weight: bold; }
    th.sat { background: var(--sat-blue); }
    th.sun { background: var(--sun-red); }

    /* 各セルの高さとボーダー */
    td { border-bottom: 1px solid #eee; height: 48px; text-align: center; }
    .other-row td { height: 34px !important; }

    /* 参加人数の集計表示用デザイン（ヘッダー内） */
    .count-box { font-size: 10px; margin-top: 3px; padding: 2px 4px; background: rgba(0,0,0,0.15); font-weight: normal; line-height: 1.3; }
    .count-row { display: flex; justify-content: space-between; }

    /* 左端の名前列固定（横スクロールしても左に残る） */
    .name-col-head, .name-cell {
      position: sticky; 
      left: 0; 
      z-index: 11; /* thの10より高く設定 */
      width: var(--name-col-width); 
    }
    .name-cell {
      padding: 0 2px; font-weight: bold; font-size: 12px; text-align: left; 
      background: #fafafa; border-right: 2px solid var(--main-green); 
      word-break: break-all; z-index: 5;
    }

    /* 自分の行をハイライト */
    .my-row { background-color: var(--my-row-bg) !important; }
    .my-row .name-cell { background-color: var(--my-row-bg) !important; }

    /* ===================================================
       4. セルの状態（ステータス）とコメント行
    =================================================== */
    /* 〇、△、× のデザイン */
    .status-cell { font-size: 24px; cursor: pointer; -webkit-tap-highlight-color: transparent; }
    .status-〇 { color: var(--main-green); font-weight: bold; }
    .status-△ { color: #f39c12; font-weight: bold; }
    .status-× { color: #7f8c8d; font-weight: bold; }
    .status-- { color: #ccc; }
    
    /* 期限切れでロックされたセルのデザイン */
    .locked { background-color: #f2f2f2 !important; color: #bbb !important; cursor: not-allowed; }

    /* コメント入力用の行 */
    .com-row td { height: 34px !important; }
    .com-row { background: #fff; }
    .com-label { font-size: 10px; color: #888; padding: 2px 6px; border-right: 2px solid #ccc; font-weight: normal; line-height: 1.2; box-sizing: border-box; }
    .com-label-top { text-align: left; display: block; margin-bottom: 2px; }
    .com-label-bottom { text-align: right; display: block; }
    .com-icon { font-size: 16px; cursor: pointer; display: flex; align-items: center; justify-content: center; width: 100%; height: 100%; }
    .com-text { font-size: 10px; color: #666; cursor: pointer; display: inline-block; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 40px; }

    /* ===================================================
       5. 汎用 UI コンポーネント（フッター、ローディング等）
    =================================================== */
    /* 画面下部の保存ボタン固定エリア */
    .footer-bar { 
      position: fixed; bottom: 0; left: 0; width: 100%; 
      padding: 10px; background: white; border-top: 1px solid #ddd; 
      display: none; box-sizing: border-box; z-index: 100; 
    }
    .btn-save { 
      width: 100%; background: var(--main-green); color: white; 
      border: none; padding: 12px; border-radius: 8px; 
      font-size: 16px; font-weight: bold; cursor: pointer; 
    }
    
    /* ローディングスピナー（ぐるぐる回るアイコン） */
    #loading { 
      position: fixed; top:0; left:0; width:100%; height:100%; 
      background:rgba(255,255,255,0.9); display:flex; flex-direction:column; 
      align-items:center; justify-content:center; z-index:9999; 
    }
    .spinner { 
      width: 40px; height: 40px; border: 4px solid #ddd; 
      border-top: 4px solid var(--main-green); border-radius: 50%; 
      animation: spin 1s linear infinite; 
    }
    @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }

    /* スクロールインジケーター（「▼ 下に続きがあります」ボタン） */
    .scroll-indicator {
      position: fixed; bottom: 75px; left: 50%; transform: translateX(-50%);
      background: rgba(0, 0, 0, 0.7); color: white; padding: 6px 16px; border-radius: 20px;
      font-size: 12px; font-weight: bold; display: none; z-index: 1000;
      pointer-events: auto; cursor: pointer; -webkit-tap-highlight-color: transparent;
      animation: bounce 1.5s infinite;
    }
    @keyframes bounce { 0%, 100% { bottom: 75px; } 50% { bottom: 65px; } }
    
    /* 閲覧モード時の微調整（保存ボタンがないため余白を詰める） */
    .view-mode .table-wrapper { margin-bottom: 0; }
    .view-mode td { height: 34px; }
    .view-mode .scroll-indicator { bottom: 20px; }
    .no-schedule-msg { padding: 40px 20px; text-align: center; font-weight: bold; color: #666; }

    /* ===================================================
       6. モーダルウィンドウ（コメント入力画面）
    =================================================== */
    .modal { 
      position: fixed; top:0; left:0; width:100%; height:100%; 
      background:rgba(0,0,0,0.6); display:none; align-items:center; 
      justify-content:center; z-index:2000; 
    }
    .modal-box { background:white; width:85%; max-width:400px; border-radius:8px; padding:20px; box-sizing:border-box; }
    .modal-title { font-weight:bold; margin-bottom:10px; font-size:14px; border-bottom: 2px solid var(--main-green); padding-bottom: 5px; }
    .modal-input { width:100%; padding:10px; font-size:14px; border:1px solid #ccc; border-radius:4px; box-sizing:border-box; margin-bottom:15px; }
    .modal-btns { display:flex; gap:10px; }
    .modal-btn { flex:1; padding:10px; border:none; border-radius:4px; font-weight:bold; cursor:pointer; }
  </style>
</head>
<body id="bodyTag">
  
  <!-- ===================================================
       Level 3: UI構造（DOM構成）
       =================================================== -->

  <!-- ローディング表示 -->
  <div id="loading">
    <div class="spinner"></div>
    <p id="loadingText">読込中...</p>
  </div>

  <!-- 初回登録画面 -->
  <div id="registration-view" style="display:none; padding:20px; text-align:center;">
    <h3 id="regTitle">初回登録</h3>
    <p>あなたのお名前を選択してください</p>
    <select id="name-list" style="width:100%; padding:12px; margin:15px 0; font-size:16px;"></select>
    <p style="font-size: 12px; color: #d35400; font-weight: bold; margin-top: 15px;">
      ※ご自身のお名前がない場合や、誤ってアクセスした場合は管理者にご連絡ください。
    </p>
    <button class="btn-save" onclick="link()">登録する</button>
  </div>

  <!-- メイン画面 -->
  <div class="container" id="main-view" style="display:none;">
    <h3 id="weekTitle"></h3>
  
    <!-- 過去データ選択UI -->  
    <div id="past-view-controls" class="past-controls">
      <select id="sel-year"></select> <span>年</span>
      <select id="sel-month"></select> <span>月</span>
      <select id="sel-monday"></select> <span>日(週)</span>
      <button class="btn-show-past" onclick="fetchPastData()">表示</button>
    </div>

    <!-- テーブル表示領域 -->
    <div class="table-wrapper" id="content-area">
      <table id="mainTable"></table>
    </div>

    <!-- スクロール補助UI -->
    <div id="scrollIndicator" class="scroll-indicator">▼ 下に続きがあります</div>
    
    <!-- 保存ボタン -->
    <div id="footer" class="footer-bar">
      <button type="button" class="btn-save" onclick="saveAll()">変更を保存して閉じる</button>
    </div>
  </div>

  <!-- コメントモーダル --> 
  <div id="commentModal" class="modal">
    <div class="modal-box">
      <div id="modalTitle" class="modal-title"></div>
      <p id="modalDesc" style="font-size:11px; color:#666; margin:0 0 5px 0;"></p>
      <input type="text" id="modalInput" class="modal-input" placeholder="特になし">
      <div class="modal-btns">
        <button class="modal-btn" style="background:#eee; color:#333;" onclick="closeModal()">キャンセル</button>
        <button id="modalApplyBtn" class="modal-btn" style="background:var(--main-green); color:white;" onclick="applyComment()">決定</button>
      </div>
    </div>
  </div>

  <script>
  /**
  * ==========================================
  * Level 1: フロントエンド概要（LIFF UI）
  * ==========================================
  * ・LINE LIFF上で動作する出欠管理UI
  * ・GASと通信しデータ取得/更新を行う
  * ・閲覧モード／編集モード切替対応
  * ==========================================
  *
  *1. 汎用Utility
  * - escapeHtml
  * - escapeJsString
  * - fetchWithTimeout
  *
  *2. 初期化/通信
  * - init
  * - fetchData
  * - link
  * - saveAll
  *
  *3. 閲覧モード系
  * - initDateDropdowns
  * - updateMondays
  * - setDropdownsToDate
  * - fetchPastData
  *
  *4. 描画/UI更新
  * - render
  * - updateHeaderCounts
  * - toggle
  *
  *5. コメントモーダル
  * - openModal
  * - viewModal
  * - applyComment
  * - closeModal
  *
  *6. スクロール制御
  * - checkScroll
  * - slowScrollToBottom
  *
  *7. イベント登録
  * - window load/init
  *
  */
    
    /* ===================================================
     Level 2: 設定・状態管理　（定数・全体変数定義）
    =================================================== */
    // GAS通信先・LIFF設定
    // ⚠ GAS_URL / LIFF_ID は本番環境識別子
    // ・変更時はGAS/LINE Developers側設定と必ず同期
    const SETTINGS = {
      //GAS_URL: "https://script.google.com/macros/s/AKfycbz4M2wVSJmz1WwE5Aevak9JN0MPZTlbNeYiPDRaFATwtrF2vJdRh2zxIgGnJe05iNoe/exec", //テスト用
      GAS_URL: "https://script.google.com/macros/s/AKfycbwx8DtziZGtKx7N3j6cZATGw5xwnS1kUcFBeyRn1yOpkrVbwyMjoO9FIbjVMZ5VGxY/exec", //リリース
      LIFF_ID: "2009266487-GEiMe9Ei"
    };

    const APP_TITLE = "父出欠確認アプリ";
    const WEEK_STRS = ["日", "月", "火", "水", "木", "金", "土"];
    
    // UI表示記号定義
    // ⚠ 配列順が toggle() の循環順に直結
    // ・変更時はGAS側集計仕様と同期必須
    const UI_CONFIG = {
      signs: ["〇", "△", "×", "-"],
      labels: { "〇": "参加", "△": "遅参", "×": "欠席", "-": "未回答" }
    };

    const STATUS_CLASS_MAP = {
      "〇": true,
      "△": true,
      "×": true,
      "-": true
    };
    
    const COMMENT_UI = {
      HAS_COMMENT: "💬",
      EMPTY_COMMENT: "＋"
    };
    
    const DISPLAY_STYLE = {
      NONE: "none",
      BLOCK: "block",
      FLEX: "flex"
    };
    
    // ==============================
    // ローディング表示文言
    // ==============================
    // ⚠ UI表示専用定数
    // ・loadingText 要素へ表示する文言を統一管理
    // ・文言変更時はユーザー操作感に影響するため注意
    // ・通信状態と一致する内容を維持する
    const LOADING_TEXT = {
      LOADING: "読込中...",
      FETCHING: "データ取得中...",
      SAVING: "保存中...",
      SAVED: "保存完了しました"
    };

    // ==============================
    // UIタイミング設定
    // ==============================
    // ⚠ 非同期UI制御用タイミング値
    // ・FETCH_TIMEOUT: fetchWithTimeout の通信制限時間(ms)
    // ・RETRY_WAIT: fetchData リトライ前待機時間(ms)
    // ・CLOSE_DELAY: 保存完了表示後にLIFFを閉じる待機時間(ms)
    // ・SCROLL_DURATION: slowScrollToBottom のアニメーション時間(ms)
    const UI_TIMING = {
      FETCH_TIMEOUT: 15000,
      RETRY_WAIT: 500,
      CLOSE_DELAY: 1200,
      SCROLL_DURATION: 1000,
      MODAL_FOCUS_DELAY: 100
    };

    const NETWORK_CONFIG = {
      FETCH_RETRY_MAX: 2
    };
    
    // ==============================
    // スクロール判定設定
    // ==============================
    // ⚠ checkScroll() の表示判定に使用
    // ・DISPLAY_MARGIN:
    //   scrollHeight と clientHeight の誤差吸収用
    // ・BOTTOM_THRESHOLD:
    //   「最下端到達」とみなす余裕px
    const SCROLL_CONFIG = {
      DISPLAY_MARGIN: 3,
      BOTTOM_THRESHOLD: 10
    };
    
    let ID_TOKEN = "";
    let MY_LINE_ID = "";       // LINEユーザーID
    let IS_VIEW_MODE = false;  // 閲覧モードかどうかのフラグ
    let DEADLINE_HOUR = 18;    // デフォルトの回答期限（当日） GAS設定値で上書きされる
    let WEEK_LABEL = "";       // 対象週のラベル（例: 2026/04/13〜）
    let BASE_DATE_STR = "";    // 週識別キー（月曜基準日）
    let days = [];             // 日付データの配列
    let rawData = [];          // 取得した全団員のデータ
    let hasChanges = false;    // 編集が行われたかどうかのフラグ
    let isSaving = false;      // 保存処理中かどうかのフラグ

    // 現在編集中のモーダルの対象インデックス
    let currentEditFIdx = -1;  // 行（団員）のインデックス
    let currentEditDIdx = -1;  // 列（日付）のインデックス

    // thead th キャッシュ
    // ⚠ updateHeaderCounts() 高速化用
    // ・toggle() 毎の querySelectorAll 実行を削減
    // ・render() 後に再取得する
    let tableHeaders = [];

    const ALERT_MESSAGES = {
      DEADLINE_LOCK:
        "回答期限：{HOUR}時を過ぎているため変更できません"
    };

    
    /* ===================================================
       Level 3: コア処理（初期化・通信）
    =================================================== */
    
    /* ===================================================
       1. 汎用Utility
    =================================================== */
    // ⚠ XSS対策用
    // ・table描画時のHTML注入防止
    // ・name/comment/dateLabel表示時に使用
    // ・innerHTMLへ未加工文字列を直接入れない
    function escapeHtml(str) {
      if (str === null || str === undefined){
        return '';
      }
      return String(str)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#39;');
    }

    // ⚠ onclick引数用エスケープ
    // ・viewModal(...) の文字列埋め込み用
    // ・シングルクォート崩れ防止
    // ・改行混入によるscript崩れ防止
    function escapeJsString(str) {
      return String(str || "")
        .replace(/\\/g, "\\\\")
        .replace(/'/g, "\\'")
        .replace(/"/g, '\\"')
        .replace(/\n/g, "\\n")
        .replace(/\r/g, "");
    }

    /**
     * 指定されたURLに対してfetch通信を行い、指定時間を超えた場合はタイムアウトさせます。
     * 電波の悪い環境で通信が永遠に止まるのを防ぎます。
     * @param {string} url - 通信先のURL
     * @param {Object} options - fetchのオプション（省略可）
     * @param {number} timeout - タイムアウトまでのミリ秒数（デフォルト15秒）
     * @returns {Promise<Response>} サーバーからのレスポンス
     */
    async function fetchWithTimeout(url, options = {}, timeout = UI_TIMING.FETCH_TIMEOUT) {
      // AbortController により一定時間で通信を強制停止
      // LIFF + モバイル回線環境で fetch が無限待機化するのを防止
      const controller = new AbortController();
      
      // timeout 経過時に abort 実行
      const id = setTimeout(() => controller.abort(), timeout);
      
      try {
        // signal を fetch に紐付けてタイムアウト制御
        const response = await fetch(url, { ...options, signal: controller.signal });
        clearTimeout(id);
        return response;
      
      } catch (e) {
      
        clearTimeout(id);
        if (e.name === 'AbortError') throw new Error("通信タイムアウト");
        throw e;
      }
    }

    /* ===================================================
       2. 初期化/通信（LIFFログイン → データ取得）
    =================================================== */
    /**
     * アプリ起動時の初期化処理を行います。
     * 1. URLパラメータから閲覧モードかどうかを判定します。
     * 2. LIFFアプリを初期化し、未ログインならログイン画面へ誘導します。
     * 3. ログイン済みならLINE IDを取得し、データ読み込み（）を開始します。
     */
    // ⚠ 重要: GASとの通信起点
    // ・GAS doGetのaction仕様と完全一致が必要
    // ・URLパラメータ変更は通信エラーの原因
    async function init() {
      document.title = APP_TITLE;
      
      const params = new URLSearchParams(window.location.search);
      IS_VIEW_MODE = (params.get('mode') === 'view');
      
      if (IS_VIEW_MODE) {
        document.getElementById("bodyTag").classList.add("view-mode");
      }

      try {
        await liff.init({ liffId: SETTINGS.LIFF_ID });
        if (!liff.isLoggedIn()) { 
          liff.login(); 
          return; 
        }
        
        const profile = liff.getDecodedIDToken();
        if (!profile || !profile.sub) {
          throw new Error("LINE認証情報取得失敗");
        }
        MY_LINE_ID = profile.sub;
        ID_TOKEN = liff.getIDToken();    // 追加
        
        await fetchData(); 
        
      } catch (e) {
        document.getElementById("loading").style.display = DISPLAY_STYLE.NONE;
        console.error(e);
        alert("初期化または通信エラーが発生しました\n\n詳細: " + e.message);
      }
    }


    /**
     * サーバー(GAS)から出欠データを取得します。
     * 通信に失敗した場合は、最大2回まで自動でリトライを行います。
     * @param {number} retryCount - 現在のリトライ回数
     * @param {string|null} targetDateStr - 過去データを検索する際の日付文字列 (例: "2026-04-13")
     */
    // ⚠ 重要: GASとの通信起点
    // ・GAS doGetのaction仕様と完全一致が必要
    // ・URLパラメータ変更は通信エラーの原因
    async function fetchData(retryCount = 0, targetDateStr = null) {
      document.getElementById("loadingText").innerText = LOADING_TEXT.LOADING;
      document.getElementById("loadingText").style.color = "#333";

      const appUrl = encodeURIComponent(window.location.href.split('?')[0]);
      let url = `${SETTINGS.GAS_URL}?uid=${MY_LINE_ID}&action=get&mode=${IS_VIEW_MODE ? 'view' : 'edit'}&appUrl=${appUrl}&v=${Date.now()}`;
      
      if (targetDateStr) {
        url += `&targetDate=${targetDateStr}`;
      }

      try {
        const res = await fetchWithTimeout(url);
        if (!res.ok) throw new Error(`HTTP Error: ${res.status}`);
        
        const data = await res.json();
        if (data.status === "error") throw new Error("GAS側エラー: " + data.message);

        // ページタイトルを動的に設定
        if (data.data && data.data.title) {
          document.title = data.data.title;
        }

        if (data.status === "success") {
          // スケジュールがない場合の処理
          if (data.data.noSchedule) {
            document.getElementById("loading").style.display = DISPLAY_STYLE.NONE;
            document.getElementById("main-view").style.display = DISPLAY_STYLE.FLEX;
            document.getElementById("weekTitle").innerText = "(未設定)";
            document.getElementById("content-area").innerHTML = '<div class="no-schedule-msg">現在、有効なスケジュールはありません</div>';
            return;
          }

          // 変数にデータを格納
          WEEK_LABEL = data.data.weekLabel;
          BASE_DATE_STR = data.data.baseDateStr;    // ★追加
          days = data.data.dates;
          rawData = data.data.families;
          if (data.data.deadlineHour !== undefined) DEADLINE_HOUR = data.data.deadlineHour;

          // メインUIの表示切り替え
          document.getElementById("main-view").style.display = DISPLAY_STYLE.FLEX;
          
          if (IS_VIEW_MODE) {
            document.getElementById("weekTitle").style.display = DISPLAY_STYLE.NONE;
            document.getElementById("past-view-controls").style.display = DISPLAY_STYLE.FLEX;
            // 閲覧モード時のドロップダウン初期化
            if (document.getElementById("sel-year").options.length === 0) initDateDropdowns();
            if (data.data.baseDateStr) setDropdownsToDate(data.data.baseDateStr);
          } else {
            document.getElementById("weekTitle").style.display = DISPLAY_STYLE.BLOCK;
            document.getElementById("past-view-controls").style.display = DISPLAY_STYLE.NONE;
            document.getElementById("footer").style.display = DISPLAY_STYLE.BLOCK;

            // 本日の日付を生成してタイトル横に表示
            const now = new Date();     
            const todayStr = `${now.getMonth() + 1}/${now.getDate()}(${WEEK_STRS[now.getDay()]})`;
//            document.getElementById("weekTitle").innerHTML = `${data.data.weekLabel} <span style="font-size: 14px; color: #555; margin-left: 8px;">本日：${todayStr}</span>`;
            document.getElementById("weekTitle").innerHTML = `${data.data.weekLabel} <span class="today-label">本日：${todayStr}</span>`;
          }

          document.getElementById("loading").style.display = DISPLAY_STYLE.NONE;
          render(); // テーブルの描画を実行

        } else if (data.status === "unregistered") {
          // 初回登録画面の表示処理
          document.getElementById("loading").style.display = DISPLAY_STYLE.NONE;
          document.getElementById("registration-view").style.display = DISPLAY_STYLE.BLOCK;
          document.getElementById("regTitle").innerText = data.data.title || APP_TITLE;
          
          const select = document.getElementById("name-list");
          select.innerHTML = ""; 
          data.list.forEach(item => {
            let opt = document.createElement("option");
            opt.value = item.id;
            opt.text = item.name;
            select.appendChild(opt);
          });
        }

      } catch (e) {
        // モバイル回線瞬断対策 一時的通信失敗時のみ自動リトライ
        // retryCount:
        // 0 = 初回通信
        // 1〜 = リトライ回数
        // NETWORK_CONFIG.FETCH_RETRY_MAX 到達後はユーザーへ通信エラー表示を行う
        if (retryCount < NETWORK_CONFIG.FETCH_RETRY_MAX) {
          // エラー時は500ms待ってから再試行
          await new Promise(resolve => setTimeout(resolve, UI_TIMING.RETRY_WAIT));
          return await fetchData(retryCount + 1, targetDateStr);
        }
        document.getElementById("loading").style.display = DISPLAY_STYLE.NONE;
        console.error(e);
        alert("通信エラー、またはタイムアウトが発生しました\n電波の良い所で再読み込みしてください");
      }
    }

    /**
     * 初回登録時にLINE IDと名前を紐付けるための通信を行います。
     */
    async function link() {
      const sid = document.getElementById("name-list").value;
      document.getElementById("loading").style.display = DISPLAY_STYLE.FLEX;
      try {
        const formData = new URLSearchParams();
      
        formData.append("action", "link");
        formData.append("uid", MY_LINE_ID);
        formData.append("idToken", ID_TOKEN);
        formData.append("family_id", sid);
      
        const res = await fetchWithTimeout(
          SETTINGS.GAS_URL,
          {
            method: "POST",
            body: formData
          }
        );
        
        const data = await res.json();

        if (data.status !== "success") {
          throw new Error(data.message || "登録失敗");
        }
        //location.reload();
        window.location.replace(window.location.href.split('?')[0]);   // 登録成功後、画面をリロードしてメイン画面へ
      
      } catch (e) {
        alert("登録エラーが発生しました\n\n" + e.message);
        document.getElementById("loading").style.display = DISPLAY_STYLE.NONE;
      }
    }

    /**
     * 編集内容をGASに保存し、完了後にLINEアプリを閉じます。
     */
    // ⚠ 最重要: データ更新の唯一の入口
    // ・payload構造はGAS processUpdateAllと完全一致必須
    // ・key名/順序変更は禁止
    // ・エンコード処理削除は通信失敗の原因
    async function saveAll() {
      if (!hasChanges) { 
        liff.closeWindow(); 
        return; 
      }
      if (isSaving) return; // 二重送信防止
      isSaving = true;

      const loader = document.getElementById("loading");
      document.getElementById("loadingText").innerText = LOADING_TEXT.SAVING;
      document.getElementById("loadingText").style.color = "#333";
      
      loader.style.display = DISPLAY_STYLE.FLEX;

      // ログイン中ユーザー自身のデータのみを抽出して送信ペイロードを作成
      const myData = rawData.find(f => f.lineIds && f.lineIds.includes(MY_LINE_ID));

      // ガード追加（ロジック非変更・安全対策）
      if (!myData) {
        alert("ユーザー情報の取得に失敗しました。再度お試しください。");
        loader.style.display = DISPLAY_STYLE.NONE;
        isSaving = false;
        return;
      }
      
      // GAS processUpdateAll 用 payload生成
      // ⚠ key名変更禁止
      // ・dateKey ベースで保存
      // ・label文字列ではなく dateKey を主キー化することで表示文言変更（日付表記変更）時もDB整合性を維持する      
      // ・weekId は週単位識別子
      // ・status/comment は1日単位
      // ・GAS側 INDEX / DB構造と完全同期前提
      // ・weekId: 週シート識別
      // ・dateKey: 日単位データ識別
      // ・両方削除すると履歴整合性が崩れるため注意
      const payload = days.map((d) => {
        const key = d.dateKey;         // dateKeyへ変更
        
        return{
          weekLabel: WEEK_LABEL,
          weekId: BASE_DATE_STR,      // 週識別キー（月曜基準日）
          
          dateLabel: d.label, 
          dateKey: d.dateKey,   // ★dateKey追加
          familyId: myData.id,
          
          // statuses は Object 前提
          // 配列・文字列等の異常データ時でも hasOwnProperty 判定で安全取得する
          status: Object.prototype.hasOwnProperty.call(myData.statuses || {}, key)
            ? myData.statuses[key]
            : "-",
          comment: myData.commentStatus?.[key] || ""  
        };
      });

      try {
        // =========================
        // POST(form-urlencoded)通信
        // =========================
        const formData = new URLSearchParams();

        formData.append("action", "update_all");
        formData.append("uid", MY_LINE_ID);
        formData.append("idToken", ID_TOKEN);
        formData.append("payload", JSON.stringify(payload));

//        await fetchWithTimeout(
//          SETTINGS.GAS_URL,
//          {
//            method: "POST",
//            mode: "no-cors",    // GAS側レスポンスは取得できないが、LIFF + GAS 環境で送信成功率を優先
//            body: formData
//          }
//        );
        
        const res = await fetchWithTimeout(
          SETTINGS.GAS_URL,
          {
            method: "POST",
            body: formData
          }
        );
        // HTTPレベルエラー確認
        if (!res.ok) {
          throw new Error(`HTTP Error: ${res.status}`);
        }
        // GASレスポンス確認
        const data = await res.json();
        if (data.status !== "success") {
          throw new Error(data.message || "保存失敗");
        }
        // 保存完了後、少し待ってからウィンドウを閉じる
        document.getElementById("loadingText").innerText = LOADING_TEXT.SAVED;
        document.getElementById("loadingText").style.color = "var(--main-green)";

        setTimeout(() => {
          liff.closeWindow();
        }, UI_TIMING.CLOSE_DELAY);
        
      } catch (e) {

        console.error(e);
        alert(
          "保存エラーが発生しました\n\n" +
          "通信環境を確認して再度お試しください"
        );

        loader.style.display = DISPLAY_STYLE.NONE;
        isSaving = false;
      }
    }


    /* ===================================================
       3. 閲覧モード系
    =================================================== */
    /**
     * ==============================================================================
     * 過去データ閲覧モード用：ドロップダウン初期化・再構築
     * ==============================================================================
     * 年・月の選択肢を生成します。引数に日付を渡すことで、その年に合わせた
     * 適切な範囲（2028年なら [2028, 2027] 等）にリストを書き換えます。
     * *  インターフェース仕様
     * @param {any} arg - 基準日（Date型, String型, または Event）。
     */
    function initDateDropdowns(arg) {
      // ----------------------------------------------------------------------------
      //  1. 基準日の判定（Eventオブジェクト誤爆防止）
      // ----------------------------------------------------------------------------
      let baseDate = new Date();
      if (arg instanceof Date && !isNaN(arg.getTime())) {
        baseDate = arg;
      } else if (typeof arg === 'string' && !isNaN(new Date(arg).getTime())) {
        baseDate = new Date(arg);
      }
      //  argがEventの場合は無視して「今日」を基準にする（読込停止を防止）

      const selYear = document.getElementById("sel-year");
      const selMonth = document.getElementById("sel-month");
      const selMonday = document.getElementById("sel-monday");
      if (!selYear || !selMonth) return;

      // ----------------------------------------------------------------------------
      //  2. 年・月の選択肢生成（再構築ロジック）
      // ----------------------------------------------------------------------------
      const currentYear = baseDate.getFullYear();
      const currentMonth = baseDate.getMonth(); 

      //  12月なら翌年を追加。システム開始の2026年を下限とする。
      const maxYear = (currentMonth === 11) ? currentYear + 1 : currentYear;
      const minYear = Math.max(2026, currentYear - 1);

      //  既存のHTMLを一度空にして生成（[2028, 2026] の不連続を解消）
      let yearHtml = "";
      for (let y = maxYear; y >= minYear; y--) {
        yearHtml += `<option value="${y}">${y}</option>`;
      }
      selYear.innerHTML = yearHtml;
  
      let monthHtml = "";
      for(let i=1; i<=12; i++) monthHtml += `<option value="${i}">${i}</option>`;
      selMonth.innerHTML = monthHtml;

      // ----------------------------------------------------------------------------
      //  3. イベントリスナーの設定（初回のみ）
      // ----------------------------------------------------------------------------
      //  既にリスナーが登録されている場合はスキップする（多重登録・停止防止）
      if (!selYear.dataset.listener) {
        const btn = document.querySelector(".btn-show-past");
    
        selYear.addEventListener("change", () => { updateMondays(); if(btn) btn.classList.add("btn-highlight"); });
        selMonth.addEventListener("change", () => { updateMondays(); if(btn) btn.classList.add("btn-highlight"); });
        if(selMonday) {
          selMonday.addEventListener("change", () => { if(btn) btn.classList.add("btn-highlight"); });
        }
    
        // リスナー登録済みフラグを立てる
        selYear.dataset.listener = "true";
      }

      // 最初の一回だけ月曜日リストを構築
      updateMondays();
    }

    /**
     * 選択されている「年・月」に基づいて、その月にある「月曜日」の日付だけを計算し、
     * 日(週)のドロップダウンにセットします。
     */
    /**
     * ==============================================================================
     * 選択曜日（月曜日）リスト更新
     * ==============================================================================
     * 元のロジックを維持しつつ、数値パースの安全性を高めています。
     */
    function updateMondays() {
      const selYear = document.getElementById("sel-year");
      const selMonth = document.getElementById("sel-month");
      const selMonday = document.getElementById("sel-monday");
      if (!selYear || !selMonth || !selMonday) return;

      const y = parseInt(selYear.value, 10);
      const m = parseInt(selMonth.value, 10);
      if (isNaN(y) || isNaN(m)) return;
  
      selMonday.innerHTML = "";
      const daysInMonth = new Date(y, m, 0).getDate(); 
      for(let d=1; d<=daysInMonth; d++) {
        const date = new Date(y, m - 1, d);
        if(date.getDay() === 1) { // 月曜日
          const opt = document.createElement("option");
          opt.value = d;
          opt.text = d;
          selMonday.appendChild(opt);
        }
      }
    }
    
    /**
     * ==============================================================================
     * 過去データの日付にドロップダウンを同期
     * ==============================================================================
     * 以前の「足りない年を一個だけ追加する安全装置」を撤廃し、
     * 「閲覧する年に合わせてリストをまるごと再構築」する手法に切り替えました。
     */
    function setDropdownsToDate(dateStr) {
      if (!dateStr) return;
      const parts = dateStr.split("-");
      //const y = parseInt(parts[0]), m = parseInt(parts[1]), d = parseInt(parts[2]);
      const y = parseInt(parts[0], 10), m = parseInt(parts[1], 10), d = parseInt(parts[2], 10);
  
      // ----------------------------------------------------------------------------
      //  1. リストの全生成（ここが修正の核）
      // ----------------------------------------------------------------------------
      // 2028年のデータなら、2028年を基準に [2028, 2027] を作り直します。
      // これにより [2028, 2026] のような飛び番は発生しなくなります。
      initDateDropdowns(new Date(y, m - 1, d));

      // ----------------------------------------------------------------------------
      // 2. 値のセットと後続処理
      // ----------------------------------------------------------------------------
      document.getElementById("sel-year").value = y;
      document.getElementById("sel-month").value = m;
  
      updateMondays(); 
      document.getElementById("sel-monday").value = d;
    }

    
    /**
     * ドロップダウンで指定した日付のデータをサーバーから取得します。
     */
    // ⚠ 注意:
    // ボタン連打による多重fetch防止のため処理中はdisabled=true化する
    async function fetchPastData() {
      const btn = document.querySelector(".btn-show-past");
      if (!btn) return;
      btn.disabled = true;
      
      try {
        // 検索開始時にボタンの強調を解除
        btn.classList.remove("btn-highlight");

        const y = document.getElementById("sel-year").value;
        const m = String(document.getElementById("sel-month").value).padStart(2, '0');
        const d = String(document.getElementById("sel-monday").value).padStart(2, '0');
        const targetDateStr = `${y}-${m}-${d}`;
      
        document.getElementById("main-view").style.display = DISPLAY_STYLE.NONE;
        document.getElementById("loading").style.display = DISPLAY_STYLE.FLEX;
        document.getElementById("loadingText").innerText = LOADING_TEXT.FETCHING;

        await fetchData(0, targetDateStr);
      } finally {
        if (btn) btn.disabled = false;
      }
    }


    /* ===================================================
       4. 描画/UI更新
    =================================================== */
    
    /**
     * 取得したデータ（rawData）を元に、HTMLのテーブル構造を生成し画面に描画します。
     * 日付ごとの各ステータス（〇、△、×）の合計人数も計算してヘッダーに表示します。
     * テーブル描画処理
     * ・再描画時にスクロール位置を保持
     * ・toggle / コメント更新後でも位置が飛ばないようにする
     */
    // ⚠ 最重要: UI描画の中核
    // ・getInitialDataのレスポンス構造に完全依存
    // ・dates / families構造変更は即表示崩壊
    // ⚠ 注意:
    // toggle() / applyComment() 後は基本的に
    // render() 全体再描画を行わず差分DOM更新する。
    // render() は初期表示・週切替・再取得時のみ実行される。
    
    function render() {
      // =========================
      // スクロール位置保持
      // =========================
      const area = document.getElementById("content-area");
      if (area) {
        requestAnimationFrame(checkScroll);
      }
      const savedScrollTop = area ? area.scrollTop : 0;
      const savedScrollLeft = area ? area.scrollLeft : 0;
      
      if (!days || days.length === 0) {
        // 日付データ未取得時は描画中断
        if (area) {
          area.scrollTop = savedScrollTop;
          area.scrollLeft = savedScrollLeft;
        }
        return;
      }

      // 日付ごとの集計配列を初期化
      // 日別集計保持 totals[日index]["〇"] の形式で保持する
      // ヘッダー人数表示更新専用
      const totals = days.map(() => {
        let obj = {};
        UI_CONFIG.signs.forEach(s => obj[s] = 0);
        return obj;
      });

      // 各団員のステータスを集計
      rawData.forEach(f => {
        days.forEach((d, i) => {
          const key = d.dateKey;              //dateKey 追加
          const s = f.statuses?.[key] || "-";

          if (Object.prototype.hasOwnProperty.call(totals[i], s)) totals[i][s]++;
        });
      });

      // テーブルのヘッダー（日付と集計）を構築
      let html = `<thead><tr><th class="name-col-head">団員<br>名簿</th>`;
      days.forEach((d, i) => {
        let cls = (d.label.includes("日") || d.label.includes("祝")) ? "sun" : d.label.includes("土") ? "sat" : "";
        html += `<th class="${cls}">${escapeHtml(d.label)}<div class="count-box">`;
        
        UI_CONFIG.signs.forEach(s => {
          html += `<div class="count-row"><span>${escapeHtml(s)}${escapeHtml(UI_CONFIG.labels[s])}</span><span>${totals[i][s]}</span></div>`;
        });
        html += `</div></th>`;
      });
      html += "</tr></thead><tbody>";

      // テーブルのボディ（各団員の行）を構築
      rawData.forEach((f, fIdx) => {
        const isMe = (!IS_VIEW_MODE && MY_LINE_ID && f.lineIds && f.lineIds.includes(MY_LINE_ID));
        const rowClass = isMe ? 'my-row' : 'other-row';
        html += `<tr class="${rowClass}"><td class="name-cell">${escapeHtml(f.name)}</td>`;
        
        // ステータス（〇△×）のセルを生成
        days.forEach((d, dIdx) => {
          const key = d.dateKey;              //dateKey 追加
          const s = f.statuses?.[key] || "-";
          
          // 編集権限があればクリックイベント（toggle）を追加
          const isLocked = d.isLocked;
          const canEdit = !IS_VIEW_MODE && isMe;
          const clickAttr = canEdit ? `onclick="toggle(${fIdx},${dIdx})"` : "";
          const lockClass = isLocked ? "locked" : "";
          
          // CSS class は status-〇 のように記号を直接使用している。
          // signs に存在しない値は class崩れ防止のため "-" にフォールバックする。
          const safeStatusClass = STATUS_CLASS_MAP[s] ? s : '-';            // status class安全化
          
          html += `
            <td
              class="status-cell status-${safeStatusClass} ${lockClass}"
              data-fidx="${fIdx}"
              data-didx="${dIdx}"
              ${clickAttr}
            >
              ${escapeHtml(s)}
            </td>`;
        });
        html += "</tr>";

        // コメント入力行の生成（本人の行、または既にコメントが存在する場合のみ表示）
        const hasComment =
          f.commentStatus &&
          typeof f.commentStatus === "object" &&
          !Array.isArray(f.commentStatus) &&
          Object.values(f.commentStatus).some(c => c && c.trim() !== "");
        
        if (isMe || hasComment) {
          html += `<tr class="com-row ${rowClass}"><td class="name-cell com-label"><span class="com-label-top">┗ 💬</span><span class="com-label-bottom">コメント</span></td>`;
          //dateKeyへ変更
          days.forEach((d, dIdx) => {
            const key = d.dateKey;
            const c = f.commentStatus?.[key] || "";

            const isLocked = d.isLocked;
            const lockClass = isLocked ? "locked" : "";

            if (isMe && !IS_VIEW_MODE) {
              // 編集モード時の本人セル：クリックでモーダルを開く
              const icon = c ? COMMENT_UI.HAS_COMMENT : COMMENT_UI.EMPTY_COMMENT;
              html += `
                <td
                  class="${lockClass}"
                  data-comment-fidx="${fIdx}"
                  data-comment-didx="${dIdx}"
                >
                  <span class="com-icon" onclick="openModal(${fIdx}, ${dIdx})">
                    ${icon}
                  </span>
                </td>
              `;              
            } else {
              // 閲覧モード時：コメントがあればアイコン表示（クリックで中身を確認）
              const safeNameJs = escapeJsString(f.name);
              const safeLabelJs = escapeJsString(d.label);    //dateKeyへ変更
              const safeCommentJs = escapeJsString(c);
              
              // onclick埋め込み用にJS文字列エスケープ済み
              // escapeHtmlではなく escapeJsString を使用する
              const displayTxt = c  ? `<span class="com-text" onclick="viewModal('${safeNameJs}', '${safeLabelJs}', '${safeCommentJs}')">💬</span>`  : '-';              
              html += `<td class="${lockClass}"><span class="com-icon">${displayTxt}</span></td>`;
            }
          });
          html += "</tr>";
        }
      });
      // DOM反映
      document.getElementById("mainTable").innerHTML = html + "</tbody>";

      // =========================
      // ヘッダーDOMキャッシュ更新
      // =========================
      // ⚠ render() 後はDOM再生成されるため
      // 毎回キャッシュを更新する
      // render() 実行時は mainTable.innerHTML を全面更新しているため、旧thead参照は破棄される。
      // そのため毎回最新DOMを再取得してキャッシュ更新する。
      tableHeaders = document.querySelectorAll("thead th");
      
      // =========================
      // スクロール位置復元
      // =========================
      if (area) {
        const maxScrollTop = area.scrollHeight - area.clientHeight;
        area.scrollTop = Math.min(savedScrollTop, maxScrollTop);
        area.scrollLeft = savedScrollLeft;
      }
      
      // 描画後、少し待ってからスクロールインジケーターの表示判定を実行
      requestAnimationFrame(() => {
        requestAnimationFrame(checkScroll);
      });
    }

    /**
     * セルがクリックされた際に、ステータス（〇→△→×→-）を順番に切り替えます。
     * @param {number} fIdx - クリックされた行（団員）のインデックス
     * @param {number} dIdx - クリックされた列（日付）のインデックス
     */
    // ⚠ 注意: ステータス更新ロジック
    // ・UI_CONFIG.signs配列順に依存
    // ・記号変更時はGAS側と必ず同期
    function toggle(fIdx, dIdx) {
      // index不整合時ガード
      if (!days[dIdx] || !rawData[fIdx]) {
        return;
      }      
      if (days[dIdx].isLocked) {
        alert(ALERT_MESSAGES.DEADLINE_LOCK.replace("{HOUR}", DEADLINE_HOUR));
        return;
      }

      const key = days[dIdx].dateKey;    // dateKey　追加
      const signs = UI_CONFIG.signs;
      
      const current = rawData[fIdx].statuses?.[key] || "-";
      const currentIndex = signs.indexOf(current);
      const next = signs[(currentIndex >= 0 ? currentIndex + 1 : 0) % signs.length];
      
      // statuses未生成時の安全初期化
      // 初回回答・データ欠損時でも更新可能にする
      if (
        !rawData[fIdx].statuses ||
        typeof rawData[fIdx].statuses !== "object" ||
        Array.isArray(rawData[fIdx].statuses)
      ) {
        rawData[fIdx].statuses = {};
      }
      // 次の記号を配列順に循環取得して更新
      rawData[fIdx].statuses[key] = next;
      
      hasChanges = true;
//      render(); // 変更を反映するために再描画

      // =========================
      // セルのみ差分更新
      // =========================
      // render() 全体再描画を行うと、
      // ・スクロール位置ジャンプ
      // ・iOS描画チラつき
      // ・入力操作中の視認性低下
      // が発生しやすいため、
      // 対象セルのみDOM更新する
      const cell = document.querySelector(
        `[data-fidx="${fIdx}"][data-didx="${dIdx}"]`
      );

      if (cell) {
        // status-* class を付け替えて色変更
        // class名は status-〇 / status-△ のように
        // 記号を直接使用しているため、
        // UI_CONFIG.signs変更時はCSS同期必須
        
        // CSS class は `status-〇` のように記号を直接含む。
        // HTML/CSS上は有効なclass名として扱われる前提。
        // signs定義変更時はCSS側class名も必ず同期すること。
//        UI_CONFIG.signs.forEach(sign => {
//          cell.classList.remove(`status-${sign}`);
//        });

        cell.classList.remove(
          "status-〇",
          "status-△",
          "status-×",
          "status--"
        );
        
        // 新しい状態classを付与して表示更新
        cell.classList.add(`status-${next}`);
        cell.textContent = next;
      }  

      // =========================
      // ヘッダー人数再集計
      // =========================
      updateHeaderCounts();
    }
   

    /**
     * 日付ヘッダー内の人数集計表示のみを再計算して更新します。
     * render() 全体を再実行せず、ヘッダー部分だけ差分更新することで
     * スクロール位置ジャンプや再描画負荷を防止します。
     *
     * ⚠ 注意:
     * ・rawData / days 構造に依存
     * ・UI_CONFIG.signs の順序変更時は表示順も変化
     */
    // ⚠ 注意:
    // thead th の先頭は名前列のため、日付ヘッダーは index + 1 で参照している。
    // ⚠ render() を呼ばず
    // ヘッダー人数表示のみ更新することで描画負荷とスクロールジャンプを防止
    function updateHeaderCounts() {
      const totals = days.map(() => {
        let obj = {};
        UI_CONFIG.signs.forEach(s => obj[s] = 0);
        return obj;
      });

      rawData.forEach(f => {
        days.forEach((d, i) => {

          const key = d.dateKey;
          const s = f.statuses?.[key] || "-";

          if (Object.prototype.hasOwnProperty.call(totals[i], s)) {
            totals[i][s]++;
          }
        });

      });

      // const headers = document.querySelectorAll("thead th");
      days.forEach((d, i) => {
        const th = tableHeaders[i + 1];
        if (!th) return;
        
        const countBox = th.querySelector(".count-box");
        if (!countBox) return;
        
        let html = "";

        UI_CONFIG.signs.forEach(s => {
          html += '<div class="count-row">' +
            '<span>' + escapeHtml(s) + escapeHtml(UI_CONFIG.labels[s]) + '</span>' +
            '<span>' + totals[i][s] + '</span>' +
            '</div>';
        });

        countBox.innerHTML = html;
      });
    }  

    
    /* ===================================================
       5. コメントモーダル
    =================================================== */
    /**
     * コメント編集用のモーダルウィンドウを開きます。
     * @param {number} fIdx - 編集対象の団員のインデックス
     * @param {number} dIdx - 編集対象の日付のインデックス
     */
    // ⚠ 注意: コメント編集処理
    // ・rawData構造に依存
    // ・indexズレが起きると別人データ書き換えリスクあり
    function openModal(fIdx, dIdx) {
      // index不整合時ガード
      if (!days[dIdx] || !rawData[fIdx]) {
        return;
      }
      if (days[dIdx].isLocked) { 
        alert(ALERT_MESSAGES.DEADLINE_LOCK.replace("{HOUR}", DEADLINE_HOUR));
        return; 
      }
      currentEditFIdx = fIdx; 
      currentEditDIdx = dIdx;

      const key = days[dIdx].dateKey;  // dateKeyへ変更

      // DOM検索コスト削減 モーダル表示時に毎回 getElementById を繰り返さない
      const modalTitle = document.getElementById("modalTitle");
      const modalDesc = document.getElementById("modalDesc");
      const modalInput = document.getElementById("modalInput");
      const modalApplyBtn = document.getElementById("modalApplyBtn");
      const commentModal = document.getElementById("commentModal");
      
      modalTitle.innerText = days[dIdx].label + " のコメント";
      modalDesc.innerText = "コメントを入力 (例: 17:30から参加)";
      modalDesc.style.display = DISPLAY_STYLE.BLOCK;
      
      if (!rawData[fIdx].commentStatus) {  rawData[fIdx].commentStatus = {};}
      modalInput.value = rawData[fIdx].commentStatus?.[key] || "";  // dateKeyへ変更
      
      modalInput.readOnly = false;
      modalApplyBtn.style.display = DISPLAY_STYLE.BLOCK;
      commentModal.style.display = DISPLAY_STYLE.FLEX;
      
      // アニメーション完了後にフォーカスを当てる
      setTimeout(() => modalInput.focus(), UI_TIMING.MODAL_FOCUS_DELAY);
    }

    /**
     * コメント閲覧専用のモーダルウィンドウを開きます（編集不可）。
     * @param {string} name - 団員の名前
     * @param {string} dateLabel - 日付のラベル
     * @param {string} text - 表示するコメント内容
     */
    // ⚠ 閲覧専用モーダル
    // ・編集不可
    // ・閲覧モード専用
    // ・text は escapeJsString 済み文字列が渡される前提
    
    function viewModal(name, dateLabel, text) {
      // DOM検索コスト削減 モーダル表示時に毎回 getElementById を繰り返さない
      const modalTitle = document.getElementById("modalTitle");
      const modalDesc = document.getElementById("modalDesc");
      const modalInput = document.getElementById("modalInput");
      const modalApplyBtn = document.getElementById("modalApplyBtn");
      const commentModal = document.getElementById("commentModal");
      
      modalTitle.innerText = `${name} ${dateLabel} のコメント`;
      modalDesc.style.display = DISPLAY_STYLE.NONE;
      modalInput.value = text;
      modalInput.readOnly = true;
      modalApplyBtn.style.display = DISPLAY_STYLE.NONE;
      commentModal.style.display = DISPLAY_STYLE.FLEX;
    }

    /**
     * モーダルに入力されたコメントをデータに適用し、モーダルを閉じます。
     */
    // ⚠ 注意: コメント編集処理
    // ・rawData構造に依存
    // ・indexズレが起きると別人データ書き換えリスクあり
    // ⚠ innerHTML 更新時:
    // currentEditFIdx/currentEditDIdx は
    // 数値indexのみ使用しておりHTML注入対象ではない
    function applyComment() {
      if (
        !days[currentEditDIdx] ||
        !rawData[currentEditFIdx]
      ) {
        closeModal();
        return;
      }
      // key は dateKey ベースで保持
      // label ではなく dateKey を使うことで 表示文言変更時でもコメント紐付けを維持する
      const key = days[currentEditDIdx].dateKey;                //dateKeyへ変更
      
      // textarea の value は文字列として取得される HTMLは解釈されず text として保持される
      const val = document.getElementById("modalInput").value;

      // commentStatus未生成時の安全初期化
      // 初回コメント入力時の undefined 防止
      if (!rawData[currentEditFIdx].commentStatus) {
        rawData[currentEditFIdx].commentStatus = {};
      }
      
      // commentStatus は Object 前提
      // 初回入力時・欠損時は上で {} 初期化済み
      // commentStatus[key] に直接代入 Object.assign 等を使わず参照維持して最小更新に留める
      rawData[currentEditFIdx].commentStatus[key] = val; 
      
      hasChanges = true;

      // render() 全体再描画を避け、コメントアイコン部分のみ差分更新
      // querySelector はコメントセルのみを対象
      // data属性で index を完全一致検索しているため別セル誤更新を防止
      const td = document.querySelector(
        `[data-comment-fidx="${currentEditFIdx}"][data-comment-didx="${currentEditDIdx}"]`
      );

      if (td) {
        const icon = val ? COMMENT_UI.HAS_COMMENT : COMMENT_UI.EMPTY_COMMENT;

        // コメント有無のみ差分更新
        // 全体render()を避けることでスクロール位置ジャンプを防止
        // innerHTML 更新範囲は固定テンプレートのみ
        // ユーザー入力値(val)は埋め込まないためHTML注入リスクなし
        td.innerHTML = `
        <span class="com-icon"
          onclick="openModal(${currentEditFIdx}, ${currentEditDIdx})">
          ${icon}
          </span>
        `;
      }
      closeModal();
    }

    /**
     * モーダルウィンドウを閉じ、編集中インデックスをリセットします。
     */
    function closeModal() {
      document.getElementById("commentModal").style.display = DISPLAY_STYLE.NONE;
      currentEditFIdx = -1; 
      currentEditDIdx = -1;
    }


    /* ===================================================
       6. スクロール制御
    =================================================== */
    /**
     * 画面のスクロール位置を判定し、「下に続きがあります」インジケーターの表示/非表示を切り替えます。
     * リストが一番下までスクロールされるとインジケーターが消えます。
     */
    function checkScroll() {
      const area = document.getElementById("content-area");
      const indicator = document.getElementById("scrollIndicator");
      if (!area || !indicator) return;
      
      // iOS Safari は小数scroll値を返す場合があるため Math.roundで誤差吸収する
      // 小数誤差でインジケーターが点滅するのを防ぐため丸める
      const scrollH = Math.round(area.scrollHeight);
      const clientH = Math.round(area.clientHeight);
      const scrollT = Math.round(area.scrollTop);
      
      const canScroll = scrollH > (clientH + SCROLL_CONFIG.DISPLAY_MARGIN);
      // 下端に到達しているか判定（10pxの余裕を持たせる）
      const isBottom = (scrollH - scrollT) <= (clientH + SCROLL_CONFIG.BOTTOM_THRESHOLD);
      
      if (canScroll && !isBottom) {
        indicator.style.display = DISPLAY_STYLE.BLOCK;
      } else {
        indicator.style.display = DISPLAY_STYLE.NONE;
      }
    }

    // スクロール時やウィンドウサイズ変更時にインジケーター判定を実行
    document.getElementById("content-area").addEventListener("scroll", checkScroll);
    window.addEventListener("resize", checkScroll);

    /**
     * 指定された要素内で、表の正確な終端（一番下）まで滑らかにスクロールさせます。
     * @param {HTMLElement} element - スクロール対象の要素（table-wrapperなど）
     * @param {number} duration - スクロールにかけるミリ秒数（小さくすると速くなる）
     */
    function slowScrollToBottom(element, duration) {
      const table = element.querySelector('table');
      if (!table) return;
      const start = element.scrollTop;
      
      // 【重要】scrollHeightではなく、tableのoffsetHeight（純粋な表の高さ）を使います。
      // これにより、余白（margin-bottom等）に惑わされず「表の最後の行」でピタッと止まります。
      const tableHeight = table.offsetHeight;
      // target は「表の最終行」が見切れない位置
      // wrapper余白ではなく table実高さ基準で算出
      const target = Math.max(0, tableHeight - element.clientHeight);
      const distance = target - start;

      // すでに下端にいる場合は何もしない
      if (distance <= 0) return;

      // 【修正ポイント】CSSの「scroll-behavior: smooth」がJavaScriptの動きを
      // 邪魔して速度が固定されないよう、一時的に「auto（即時移動）」に固定します。
      const originalStyle = element.style.scrollBehavior;
      element.style.scrollBehavior = 'auto'; 

      let startTime = null;

      // requestAnimationFrameを使って、指定時間かけてコマ送りアニメーションを行います。
      // requestAnimationFrame はブラウザ描画タイミング同期
      // setTimeout よりスクロールが滑らかになりやすい
      function animation(currentTime) {
        if (startTime === null) startTime = currentTime;
        const timeElapsed = currentTime - startTime;
        
        // なめらかな加減速の計算（イージング）
        const run = easeInOutQuad(timeElapsed, start, distance, duration);
        element.scrollTop = run;

        if (timeElapsed < duration) {
          requestAnimationFrame(animation);
        } else {
          // アニメーション完了時に最終位置を補正し、CSSを元の状態に戻します
          element.scrollTop = target;
          element.style.scrollBehavior = originalStyle;
        }
      }

      // イージング関数（最初はゆっくり、途中で速く、最後はまたゆっくり）
      function easeInOutQuad(t, b, c, d) {
        t /= d / 2;
        if (t < 1) return c / 2 * t * t + b;
        t--;
        return -c / 2 * (t * (t - 2) - 1) + b;
      }

      requestAnimationFrame(animation);
    }

    // インジケーター（▼ボタン）が押された時の挙動を登録します
    document.getElementById("scrollIndicator").onclick = function() {
      const area = document.getElementById("content-area");
      
      // 1000ミリ秒（1秒）かけて下までスクロールします（数字を減らすと速くなります）
      slowScrollToBottom(area, UI_TIMING.SCROLL_DURATION); 
    };

    /**
     * iOS等のブラウザで、画面全体が引っ張られてリロード（バウンス）するのを防ぎます。
     * ただし、テーブルの中身やモーダル内はスクロールできるように許可します。
     */
    // body全体の overscroll/bounce を抑止
    // table-wrapper と modal-box 内のみ ネイティブスクロールを許可する
    document.addEventListener('touchmove', function(e) {
      if (e.touches.length > 1) return; // ピンチズーム等は許可
      if (!e.target.closest('.table-wrapper') && !e.target.closest('.modal-box')) { 
        e.preventDefault(); 
      }
    }, { passive: false });

    // アプリの起動エントリポイント
    window.addEventListener('load', init);
  </script>
</body>
